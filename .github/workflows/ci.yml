name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install Flask==3.1.2 pytest==8.4.1
      - name: Compile application
        run: python -m compileall -q app run.py wsgi.py
      - name: Run tests
        run: python -m pytest -q

